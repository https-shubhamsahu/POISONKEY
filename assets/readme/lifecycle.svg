<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">POISONKEY credential lifecycle</title>
<desc id="desc">Lifecycle of one POISONKEY credential. The owner calls publish with a 50 XLM bond, a 50 percent bounty and a 7 day expiry. A reader calls bond, moving 50 XLM into the contract and registering an ed25519 public key, which puts the key in BONDED, status 0. From there prove_leak by anyone holding the secret moves it to BURNED, status 1, paying 25 XLM to the claimant and 25 XLM to the owner, or release by the reader after expires_at moves it to RELEASED, status 2, returning the full 50 XLM. Both end states are final.</desc>

