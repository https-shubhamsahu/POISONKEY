<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="476" viewBox="0 0 1200 476" role="img" aria-labelledby="title desc">
<title id="title">The 88-byte leak proof binds the claimant</title>
<desc id="desc">The 88-byte proof message. Bytes 0 to 32 hold the raw grant_id, bytes 32 to 88 hold the claimant's 56-character Stellar address. ALICE signs it with BOB's leaked secret and calls prove_leak: the contract rebuilds the same bytes and the signature verifies, paying 25 XLM to ALICE and 25 XLM to the owner. MALLORY copies the same signature and names herself as claimant: bytes 32 to 88 change, verification traps and nothing moves.</desc>

