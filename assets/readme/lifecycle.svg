<text x="48" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8f9894" text-anchor="start">BURNED and RELEASED are final: a second prove_leak or release on that key fails with WrongStatus.</text>
