<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#121814"/>
      <stop offset="60%" stop-color="#08090a"/>
      <stop offset="100%" stop-color="#040505"/>
    </radialGradient>
    
    <!-- Neon Poison Glow -->
    <radialGradient id="toxicGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#b6ff3c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b6ff3c" stop-opacity="0"/>
    </radialGradient>

    <!-- Key & Skull Gradient -->
    <linearGradient id="poisonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccff55"/>
      <stop offset="50%" stop-color="#b6ff3c"/>
      <stop offset="100%" stop-color="#80e010"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#b6ff3c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="#b6ff3c" stroke-opacity="0.35" stroke-width="6"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#b6ff3c" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Radial Toxic Aura behind logo -->
  <circle cx="256" cy="220" r="160" fill="url(#toxicGlow)"/>

  <!-- Crossbones / Cross-Keys in background -->
  <g stroke="url(#poisonGreen)" stroke-width="16" stroke-linecap="round" opacity="0.25">
    <line x1="130" y1="120" x2="382" y2="340"/>
    <line x1="382" y1="120" x2="130" y2="340"/>
    <circle cx="130" cy="120" r="16" fill="#08090a"/>
    <circle cx="382" cy="120" r="16" fill="#08090a"/>
    <circle cx="130" cy="340" r="16" fill="#08090a"/>
    <circle cx="382" cy="340" r="16" fill="#08090a"/>
  </g>

  <!-- Main Skull Key Body -->
  <g filter="url(#neonGlow)">
    <!-- Skull Cranium Top -->
    <path d="M 166,220 
             C 166,130 210,90 256,90 
             C 302,90 346,130 346,220 
             C 346,245 336,260 320,270
             L 320,300
             C 320,308 312,314 304,314
             L 208,314
             C 200,314 192,308 192,300
             L 192,270
             C 176,260 166,245 166,220 Z" 
          fill="url(#poisonGreen)" />

    <!-- Eye Sockets (Dark Cutouts) -->
    <!-- Left Eye -->
    <circle cx="216" cy="205" r="20" fill="#08090a"/>
    <!-- Right Eye -->
    <circle cx="296" cy="205" r="20" fill="#08090a"/>

    <!-- Nasal Cavity -->
    <polygon points="256,222 244,248 268,248" fill="#08090a"/>

    <!-- Teeth / Vertical Grille Slots in Jaw -->
    <rect x="224" y="280" width="10" height="34" rx="3" fill="#08090a"/>
    <rect x="251" y="280" width="10" height="34" rx="3" fill="#08090a"/>
    <rect x="278" y="280" width="10" height="34" rx="3" fill="#08090a"/>

    <!-- Key Shaft -->
    <path d="M 240,310 
             L 272,310 
             L 272,430 
             C 272,438 265,444 256,444 
             C 247,444 240,438 240,430 Z" 
          fill="url(#poisonGreen)" />

    <!-- Cryptographic Key Bits / Notches on Right Side of Shaft -->
    <!-- Bit 1 -->
    <path d="M 270,345 L 310,345 C 314,345 316,348 316,352 L 316,370 C 316,374 314,376 310,376 L 270,376 Z" fill="url(#poisonGreen)"/>
    <!-- Bit 2 -->
    <path d="M 270,392 L 298,392 C 302,392 304,394 304,398 L 304,416 C 304,420 302,422 298,422 L 270,422 Z" fill="url(#poisonGreen)"/>

    <!-- Cryptographic Bit Hole inside Bit 1 -->
    <circle cx="294" cy="360" r="5" fill="#08090a"/>
  </g>
</svg>
